# Diodine VM Phase 1 — machine-readable policy.
#
# Every statement here is an assertion that Phase 2 adversarial tests must be
# able to check. A test that does not map to a statement in this file is not
# testing the policy; it is testing an assumption. Add the statement first.
#
# Fields:
#   id          stable identifier, referenced by test names
#   claim       what the system asserts
#   enforced_by where the enforcement actually lives
#   verify      how Phase 2 checks it
#   status      enforced | partial | not-enforced | inherited | measured
#
# "measured" is for a limitation that is real, quantified, and bounded by
# something -- as distinct from "not-enforced", which is a limitation nobody has
# put a number on yet. Moving a statement from not-enforced to measured requires
# the numbers and the method to reproduce them, in the note.

version: 1
phase: 1

policy:

  - id: NET-001
    claim: The analysis VM has no network interface of any kind.
    enforced_by: qemu -nic none; no netdev is defined on the command line
    verify: guest enumerates /sys/class/net and finds only loopback
    status: enforced

  - id: NET-002
    claim: The analysis VM cannot reach any third party on the internet.
    enforced_by: NET-001 (no interface exists to route from)
    verify: host observes zero packets attributable to the guest
    status: enforced

  - id: FS-001
    claim: The guest has no shared-folder access to the host filesystem.
    enforced_by: no -fsdev / -virtfs / virtiofsd on the command line
    verify: guest finds no 9p or virtiofs filesystem type available
    status: enforced

  - id: FS-002
    claim: The host never mounts, loop-mounts, or otherwise parses a filesystem
           authored by the guest.
    enforced_by: output channel is a byte stream; no block device crosses the
                 boundary; diodine-run never invokes mount
    verify: audit the launcher and receiver for mount/losetup calls
    status: enforced

  - id: FS-003
    claim: The guest's base image cannot be modified by the guest.
    enforced_by: direct kernel boot with no block device of any kind; per-run
                 files ride in as a second cpio concatenated onto the base
                 initramfs, which is itself never rewritten
    verify: base image sha256 is identical before and after a run
    status: enforced

  - id: DEV-001
    claim: No USB controller or USB device is exposed to the guest.
    enforced_by: qemu -nodefaults; no -usb / -device usb-* on the command line
    verify: guest finds no USB host controller in /sys/bus/usb
    status: enforced

  - id: DEV-002
    claim: No graphics adapter is exposed to the guest.
    enforced_by: qemu -display none -vga none
    verify: guest finds no DRM or framebuffer device
    status: enforced

  - id: DEV-003
    claim: No host device is passed through to the guest.
    enforced_by: no -device vfio-pci / -device usb-host on the command line
    verify: guest PCI enumeration contains only the virtio devices we declared
    status: enforced

  - id: DEV-004
    claim: No clipboard or console-sharing channel exists between guest and host.
    enforced_by: no SPICE agent, no vdagent, no -display with clipboard support
    verify: guest finds no vdagent virtserialport
    status: enforced

  - id: DEV-005
    claim: The guest is given no source of host entropy by default.
    enforced_by: virtio-rng is omitted unless --allow-rng is passed explicitly
    verify: guest finds no /dev/hwrng backed by virtio-rng
    status: enforced
    note: This is a host-to-guest data path, however low-value. It is opt-in so
          that enabling it is a recorded decision rather than a default.

  - id: OUT-001
    claim: The output channel carries bytes from guest to host only. No host-side
           descriptor exists through which a byte could reach the guest.
    enforced_by: QEMU's pipe chardev is backed by a FIFO pair -- it writes guest
                 output to iv.out and reads host input from iv.in. The launcher
                 creates both (QEMU will not start otherwise) and nothing in
                 Diodine ever opens iv.in; the receiver opens only iv.out, and
                 only O_RDONLY. With no writer, the guest's reads see EOF
                 forever. Directionality is a property of which descriptors
                 exist, so it survives a compromised receiver.
    verify: guest reads the port and observes zero readable bytes; code audit
            confirms iv.in is referenced only by mkfifo and that the receiver's
            channel open call carries neither O_RDWR nor O_WRONLY
    status: enforced
    note: An earlier design used a unix socket with shutdown(SHUT_WR). It is
          incompatible with QEMU -- the socket chardev reads the resulting EOF
          as a disconnect and tears the channel down. The FIFO pair gives a
          strictly stronger property -- the absence of a descriptor rather
          than a revoked one.

  - id: OUT-002
    claim: The output channel is not perfectly one-way. Flow control forms a
           reverse channel, and its per-run capacity is bounded by RES-006's byte
           cap at a few hundred bits.
    enforced_by: RES-006 -- not by design, but because every symbol the guest can
                 read costs it export budget. Detecting one stall requires
                 refilling the buffer between write() and read(), measured at
                 585728 bytes, so the default 256 MB total cap allows on the
                 order of 450 detections per run whatever the symbol rate
    verify: tests/out002 -- a static probe writes a carrier and times each
            write(); the host transmits by SIGSTOP/SIGCONT on whichever process
            holds iv.out open. See the note for the numbers to reproduce
    status: measured
    note: |
      Measured on the development host, replacing the earlier estimate of "a few
      bits per second" in diodine.md, which was a guess in the wrong direction.

        buffer depth       585728 bytes (0.56 MiB), identical across runs
        detection floor    ~8 ms, the time to refill that buffer at ~73 MB/s
        long-stall fidelity  19.02 s measured against 20.00 s commanded; five
                             repeats of one 3-symbol stall landed within 3 ms
        short pulses       10/20/50 ms all read back as 15-32 ms with 5-11 ms
                           spread, and the guest sees MORE blocking writes than
                           were commanded
        per-run capacity   ~450 symbols, byte-capped, not time-capped

      The short-pulse noise is the interesting part. At full speed the receiver
      cannot keep up -- it hashes and writes to disk -- so it stalls on its own,
      producing blocking writes indistinguishable from signal and of the same
      magnitude. The channel is self-noisy at the rate that would make it fast.
      Writing slowly enough to quiet that noise enlarges the refill time and
      lowers the symbol rate, and the guest cannot escape the trade.

      What bounds this is a control that already existed for another reason. No
      new mechanism is proposed: raising --max-total raises this channel's
      capacity proportionally, which is worth knowing before anyone raises it.

      Two things this measurement got wrong before the instrument was fixed, both
      worth keeping as warnings. Modulating by SIGSTOP on a process matched by
      command line stopped the pyenv shim -- bash pyenv-exec python3 receiver --
      whose argv contains the receiver path while its child does the reading. The
      reader kept draining, and the arms built on it reported no backpressure at
      all, up to 512 MB. Identifying the reader by which process holds the FIFO
      open fixed it, which is the same argument OUT-001 rests on. Separately, the
      pulse analyser paired commanded and observed events in order, so a single
      missed pulse shifted every later pair and made a 100 ms stall read as
      39 ms. One duration per run removes the ambiguity.

  - id: OUT-003
    claim: The receiver never parses artifact content.
    enforced_by: receiver reads a fixed-size header and copies N bytes; it does
                 not decompress, decode, or inspect payloads
    verify: code audit; receiver imports no archive or media library
    status: enforced

  - id: RES-001
    claim: Guest memory is capped and never reaches host swap.
    enforced_by: systemd-run --user --scope -p MemoryMax -p MemorySwapMax=0
    verify: read memory.max and memory.swap.max from the run's cgroup
    status: enforced

  - id: RES-002
    claim: Guest CPU consumption is capped.
    enforced_by: systemd-run --user --scope -p CPUQuota
    verify: read cpu.max from the run's cgroup
    status: enforced

  - id: RES-003
    claim: Guest process count is capped.
    enforced_by: systemd-run --user --scope -p TasksMax
    verify: read pids.max from the run's cgroup
    status: enforced

  - id: RES-004
    claim: The guest cannot drive unbounded host disk I/O.
    enforced_by: the guest has no block device, so there is no guest disk I/O to
                 cap. Every host write it can induce is bounded elsewhere --
                 console output by RES-007 and the wall clock, exported artifacts
                 by RES-006, and swap by MemorySwapMax=0
    verify: guest enumerates no block device; console throughput stays within the
            RES-007 envelope; exported bytes stay within the RES-006 caps
    status: enforced
    note: This previously read "Guest disk I/O bandwidth is capped" and was filed
          not-enforced pending an io cgroup delegation. That framing assumed a
          guest with a disk. This one has none, so the delegation would have
          throttled exactly one path -- qemu writing console.log at roughly 50 KB
          per second, already the slowest thing in the system -- and would not
          have touched artifact writes at all, because the receiver runs outside
          the run's cgroup scope. That placement is deliberate and should stay. A
          receiver inside the guest's resource envelope could be starved by the
          guest whose export caps it exists to enforce.

  - id: RES-008
    claim: Quarantine growth across runs is bounded by operator retention policy,
           not by Diodine.
    enforced_by: nothing bounds it -- RES-006 caps a single run at 256 MB and
                 nothing caps the number of runs. The launcher reports the
                 cumulative total after every run and warns past
                 --quarantine-warn-mb, default 5000
    verify: a run with --quarantine-warn-mb 0 warns; a run under the threshold
            still reports the total
    status: not-enforced
    note: |
      Reporting is not a bound and the status stays not-enforced. What changed is
      that the number is now impossible to miss, which is the most Diodine can
      honestly do here.

      Nothing prunes automatically, deliberately. Auto-deleting quarantined
      output is the kind of helpfulness that destroys the evidence someone came
      back for, and the caps that matter per-run all already hold. Retention is
      an operator decision; the tool's job is to make the figure visible.

      Surfaced while re-examining RES-004 -- the per-run bounds were all in place
      and the cross-run total had simply never been stated, the kind of gap that
      only appears when a claim is rewritten. Then it demonstrated itself: one
      afternoon of testing put 4.8 GB across 76 runs into quarantine, 4 GB of it
      six OUT-002 carrier runs at 514 MB each. Every per-run cap held throughout
      and it was still the largest resource event of the session. Cumulative size
      is the signal that would have flagged it; run count would not have.

      Related to QUAR-001, which covers what must not read those directories
      rather than how long they persist.

  - id: RES-005
    claim: A run cannot exceed its wall-clock budget.
    enforced_by: launcher enforces a deadline and destroys the VM on expiry
    verify: a guest that spins forever is killed at the deadline
    status: enforced

  - id: RES-006
    claim: Total exported bytes, per-artifact bytes, and artifact count are all
           bounded, and are enforced on the host side of the boundary.
    enforced_by: receiver enforces caps while streaming, before writing to disk
    verify: a guest that emits an oversized artifact is cut off mid-stream and
            the partial file is removed
    status: enforced

  - id: RES-007
    claim: Guest console output is deliberately left outside the export caps, and
           bounded instead by the wall clock and the emulated 16550's throughput
           ceiling -- about 9 MB at the default 180 second budget.
    enforced_by: RES-005's wall clock, plus the ~50 KB/s ceiling of the emulated
                 16550 UART. RES-006 deliberately does not apply -- console bytes
                 never pass through the receiver, so nothing charges them against
                 a cap, and that is the decision rather than the gap
    verify: a guest writing to /dev/console as fast as it can sustains roughly
            50 KB per second, so about 9 MB at the default 180 second budget; the
            launcher warns when --timeout exceeds an hour, where that figure stops
            being negligible
    status: enforced
    note: |
      Decided in Phase 2 (NEXT.md W3) rather than left open. This previously read
      "bounded only indirectly" at status partial, which described it as an
      unclosed gap. It is not one; it is a trade.

      Bringing the console inside the byte budget means replacing -chardev file
      with a second FIFO drained by a bounded writer -- QEMU offers no size bound
      on the file backend (checked: path and append, nothing else). But
      -chardev file is timing-inert precisely BECAUSE it is unbounded: QEMU never
      blocks on it. A bounded writer would buy a byte cap at the cost of a second
      OUT-002-style timing channel, one the guest could modulate exactly as it
      modulates the artifact channel. Capping the console and keeping it inert are
      in tension and cannot both be had.

      At ~50 KB/s the uncapped version is cheap: 9 MB per default run, against a
      256 MB export cap on the channel that IS bounded. Paying a covert channel to
      close a 9 MB write is a bad trade, so it is not made.

      Measured rather than assumed: 45 KB per second with small writes, 52 KB per
      second with 64 KB blocks and four concurrent writers -- concurrency does not
      raise it, because the 16550 is a single serialized device.

      The tripwire check in tests/run-checks stays, and is the real point of the
      number. Replacing the serial chardev with virtio-console would raise this
      ceiling by orders of magnitude, and that check is what would notice.

  - id: ING-001
    claim: Decompression of exported archives is bounded by ratio, absolute
           output size, file count, and nesting depth.
    enforced_by: diodine-ingest; it never calls extractall
    verify: a zip bomb is refused without exhausting storage
    status: enforced

  - id: ING-002
    claim: Ingest cannot write outside its destination directory.
    enforced_by: diodine-ingest rejects absolute paths, traversal, symlinks,
                 hardlinks, and non-regular members
    verify: an archive containing ../../etc/passwd and a symlink member is refused
    status: enforced

  - id: ING-003
    claim: Every expanded file can be attributed to the archive it came from, and
           guest-chosen member names share no namespace with the directories
           ingest expands into.
    enforced_by: diodine-ingest names a nested archive's expansion by the
                 archive's path RELATIVE to its level rather than by basename,
                 and places it in a sibling `.nested` tree rather than in the
                 level itself, so member names and expansion directories cannot
                 collide; a collision that does occur aborts the ingest
                 (makedirs exist_ok=False) instead of merging
    verify: tests/adversarial/ingest -- two archives sharing a basename in
            different directories expand to separate directories; an archive
            shipping a member named to squat on the directory a sibling archive
            will expand into does not commingle with it
    status: enforced
    note: |
      Found by the Phase 2 adversarial corpus, not by an audit of this file.
      maybe_recurse() derived the nested output directory from
      os.path.basename(path) alone and then called makedirs(exist_ok=True), so
      a/m.zip and b/m.zip expanded into ONE directory and commingled, at exit 0,
      with the log printing "nested zip at depth 1: m.zip" twice.

      Never an escape -- safe_member_path still confined every member under the
      destination, so ING-002 held throughout. The damage was to attribution:
      the output could not say which archive a file came from, which is the
      property an analyst is actually relying on. It also gave a
      denial-of-analysis, since planting a colliding member name makes O_EXCL
      refuse a benign archive.

      Preserving the relative path is NOT sufficient on its own, and that is why
      the `.nested` tree exists. Expanding in place beside the archive still
      shares a namespace with the guest: a member named a/m.zip.d1/decoy.txt
      lands in exactly the directory a/m.zip is about to expand into. Separating
      the two namespaces is the same structural argument AUD-002 settled for the
      run directory -- guest names in artifacts/, host records outside it --
      applied one stage later. Reserving or sanitising names was rejected there
      for the reason it would be rejected here: it fails silently the day
      someone adds a name to the set.

  - id: QUAR-001
    claim: Quarantine storage is excluded from automatic consumers (indexers,
           thumbnailers, antivirus, backup).
    enforced_by: exclusion markers written into the quarantine root, plus a
                 startup scan that names any indexer, thumbnailer, antivirus or
                 backup agent currently running. The scan warns and never blocks,
                 and its result is recorded in the run's RUN.json
    verify: markers present; a process whose comm matches a watched consumer makes
            the run warn and appear in RUN.json as
            quarantine_consumers_running; a host with none stays quiet
    status: partial
    note: |
      Markers are advisory and always will be -- Diodine cannot make a
      third-party agent honour them. Detection is the honest ceiling: it converts
      a silent weakness into a visible one, per run, in the run's own record.

      It warns rather than refusing, unlike VMM-002. These are host-wide desktop
      services that Diodine cannot reconfigure, and refusing to run on any
      machine with a file indexer would make the tool unusable without making the
      quarantine any safer. Fail-closed is right when the tool can fix the
      condition or the operator can; neither holds here.

      Real enforcement is a host decision and out of Diodine's reach: a dedicated
      filesystem for quarantine mounted nodev, nosuid, noexec, plus per-tool
      exclusions. On the development host quarantine sits on / with plain
      rw,relatime, so nothing structural separates it from the rest of the home
      directory.

      The scan matches on /proc/<pid>/comm, never on cmdline. A cmdline match
      finds the process doing the matching, whose own arguments contain every
      name in the watch list -- that exact mistake reported all six watched
      consumers as running on a host with none of them.

  - id: AUD-001
    claim: Every run records the boundary state that was actually live while it
           ran, measured from the running VMM rather than declared by the
           launcher's intent.
    enforced_by: diodine-run writes RUN.json into the run's quarantine
                 directory, reading attr/current, seccomp mode, uid and the
                 cgroup limits back from the live process
    verify: RUN.json exists for the run; its observed flag is true; its policy
            block agrees with the measured vmm fields; and a run where the VMM
            was never sampled reports "unknown" rather than asserting a state it
            did not see
    status: enforced
    note: Written by the launcher, not the receiver. The receiver cannot observe
          confinement, so having it restate a launcher claim would launder a
          launch-side assertion through the one component that faces the guest.
          Motivated by eight consecutive runs that reported confinement
          correctly while the profile denied qemu's NUMA probe on every one of
          them -- nothing on disk recorded either fact.

  - id: AUD-002
    claim: A guest cannot forge, replace, or suppress any host-authored record of
           its own run.
    enforced_by: guest-chosen artifact names are written into the artifacts/
                 subdirectory of the run and cannot contain a slash, so they
                 share no namespace with MANIFEST.json, RUN.json or console.log;
                 the manifest is written to a temporary name and renamed into
                 place, so nothing sitting at its destination can block it
    verify: a payload emitting artifacts named MANIFEST.json, RUN.json,
            console.log and RUN.json.writing leaves all three host records
            intact and correct, and is still itself delivered
    status: enforced
    note: Found by emitting an artifact called MANIFEST.json. The name passed
          validation, O_EXCL created it mode 0400 before the receiver wrote its
          own manifest, and the receiver then died on PermissionError inside a
          finally block -- leaving the run's audit record claiming it had
          exported nothing, beside an artifact it never listed, while the
          launcher still exited 0. Reserving names by enumeration was rejected
          as the fix, because it must list every record the host may ever write
          and fails silently the day one is added. RUN.json.writing is in the
          test for exactly that reason.

  - id: AUD-003
    claim: Every statement in this file is either verified by a check in
           tests/run-checks that names it, or listed there as an exemption with
           the reason and the place its evidence lives instead -- and every
           check names a statement that exists here.
    enforced_by: tests/run-checks section L reads this file and compares its
                 statement ids against the ids the harness passes to ok/bad/check
    verify: the comparison is driven against a fabricated statement and a
            fabricated check label, and must report each one
    status: enforced
    note: The header rule above -- add the statement before the test -- was
          honoured by convention and checked by nothing; the harness never read
          this file. The unchecked direction is the dangerous one. A statement
          can lose its check, or never have had one, and every run still reports
          every check passing, which is the reassuring-failure shape Phase 1
          kept finding in its instruments. It had already happened here: RES-001,
          RES-002, RES-003 and DEV-003 each carried status enforced and a
          concrete verify recipe that nothing executed. The evidence they name
          was being collected the whole time -- the cgroup limits in RUN.json,
          the PCI enumeration in probe.txt -- and simply never read.

  - id: AUD-004
    claim: Every run records whether MAC denial checking was available to it, and
           when it was, every denial the VMM's confinement profile produced during
           that run.
    enforced_by: diodine-run anchors a journal position before launch and reads
                 the window back after the VMM has exited, matching records
                 carrying both apparmor="DENIED" and profile="diodine-qemu".
                 Availability is decided by a live read, never by group
                 membership. The result lands in the run's RUN.json as a denials
                 block; when the read is unavailable that block says
                 checked=false and gives the reason
    verify: RUN.json carries a denials block; tests/run-checks FAILS when it reads
            checked=false rather than skipping; the counter is driven positive by
            aa-exec -p diodine-qemu -- /bin/cat /etc/hostname, which is refused by
            the real profile and needs no privilege, and driven negative by a
            window containing no denial, which must report count 0 and not
            checked=false
    status: enforced
    note: |
      The claim is about RECORDING, not about checking, and that is deliberate. A
      host can be blind -- reading the kernel audit log needs a privilege TCB-001
      forbids this launcher -- so a claim that denials are always checked would be
      unsatisfiable, the same defect VMM-002 had when its detection required root.
      What can always be true is that the run says which of the two it was.

      Who tolerates the gap is the whole design. The launcher records and keeps
      running, the way QUAR-001 warns rather than refusing: journal access is a
      host-wide condition Diodine cannot fix, and refusing every run on an
      unprovisioned host would not make any run safer. tests/run-checks does NOT
      tolerate it and fails, because a suite reporting all-green while blind to
      denials is the exact reassuring-failure shape Phase 1 kept finding in its
      own instruments.

      Motivated by the NUMA denial. The profile denied qemu's readdir of
      /sys/devices/system/node/ on EVERY confined run. It was non-fatal, cost
      nothing visible, and 26/26 checks passed twice while it fired. A check that
      failed a run producing any denial would have caught it on day one.

      Detection must NOT read group membership. Supplementary groups are fixed at
      login, so `id -Gn | grep systemd-journal` reports success in a fresh session,
      failure in a stale one that has not logged out since provisioning, and
      success on a host whose journal ACL has been stripped. It must also test
      journalctl's OUTPUT and never its exit status: journalctl exits 0 while
      printing "-- No entries --", and Phase 1 already shipped that bug in the
      other direction with a dmesg pipeline that returned tail's exit status and
      reported "no denials" from a log it never read.

      journald rate-limits at 10000 messages per 30s by default, so a denial storm
      can be dropped. The run reads journald's own "Suppressed N messages" record
      from the same window and reports the count as a LOWER BOUND when it appears
      -- an upper bound with no lower bound is how a dead test passes.

      Host-provisioned, like VMM-002's profile: sudo usermod -aG systemd-journal,
      then log out and back in. policy/apparmor/install prints both steps, since it
      is already the one place an operator is told to provision the host.

  - id: VMM-001
    claim: The VMM process runs unprivileged and under a seccomp sandbox.
    enforced_by: no sudo anywhere in the launcher; qemu -sandbox on with
                 obsolete/elevateprivileges/spawn/resourcecontrol all denied
    verify: inspect the qemu process uid and its seccomp status in /proc
    status: enforced

  - id: VMM-002
    claim: The VMM process is confined by mandatory access control.
    enforced_by: AppArmor profile diodine-qemu, applied via aa-exec
    verify: read attr/current for the qemu process, located via the run's cgroup
            scope rather than by process name -- comm truncates at 15 characters,
            so qemu-system-x86_64 cannot be matched by name, and a command-line
            match will match the searching process itself. Confined runs read
            "diodine-qemu (enforce)".
    status: enforced
    note: |
      Fail-closed. A run whose profile is not loaded REFUSES to start and exits
      2, before the receiver is up or a quarantine directory exists, so a refused
      run leaves no debris. Waiving it requires --allow-unconfined on the command
      line, and the waiver is recorded in the run's own RUN.json as
      "unconfined_waived" with VMM-002 reading "WAIVED (--allow-unconfined)".

      This was status partial while the launcher warned and continued. That
      default was wrong for the reason it always is -- the warning went to
      stdout, scrolled past, and nothing on disk recorded that a run had no MAC
      confinement. Eight consecutive runs here went unconfined without anyone
      noticing. Silence is not the failure mode you want from a boundary.

      Detection must NOT read the profile set. aa-status --profiled and
      /sys/kernel/security/apparmor/profiles are both root-only, and TCB-001
      forbids this launcher root, so a readability check reports "not loaded"
      however the profile is installed -- which made this claim unsatisfiable
      rather than merely unmet, and would now make it refuse every run. Detection
      is by attempted transition, which needs no privilege.

      Still host-provisioned: the profile has to be loaded once with
      sudo policy/apparmor/install, and it has been exercised on the development
      host only. What changed is that an unprovisioned host now stops instead of
      quietly proceeding.

  - id: TCB-001
    claim: No root-privileged daemon is introduced into the trusted computing
           base by Diodine itself.
    enforced_by: direct QEMU invocation; no libvirtd
    verify: no Diodine component runs as uid 0
    status: enforced

  - id: PLAT-001
    claim: Microarchitectural side channels are out of scope and inherited from
           the platform.
    enforced_by: nothing — platform responsibility
    verify: not verified by Diodine; see the microarchitectural section of the
            design document
    status: inherited
