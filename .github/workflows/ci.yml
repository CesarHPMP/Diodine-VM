#
# What this workflow can and cannot establish, stated up front because a green
# check mark is exactly the kind of reassuring signal this project keeps finding
# to be wrong:
#
#   CAN   -- the tree parses, builds and carries its licence (tests/lint), and
#            the adversarial corpora pass (tests/adversarial/run). Those 61 cases
#            drive the REAL receiver and the REAL ingest binary, so they are
#            genuine evidence about the two components that parse hostile input.
#
#   CANNOT -- anything about whether the isolation boundary holds. tests/run-checks
#            needs KVM, a loaded AppArmor profile, a systemd user scope and journal
#            access. A GitHub runner has none of them, and faking any of it would
#            produce a passing check that certifies nothing -- the precise failure
#            mode NEXT.md was written about.
#
# So CI is a hygiene gate, not a verification of the security claims. The boundary
# is verified by running tests/run-checks on a provisioned host, and nowhere else.

name: CI

on:
  push:
    branches: [main, 'phase*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests/lint
        run: ./tests/lint

  adversarial:
    name: Adversarial corpora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version in use
        run: python3 --version
      # Not piped into anything. The exit status is the result -- piping a
      # harness into tail once masked a failing status here for a whole session.
      #
      # frames and ingest only. The third suite, `exhaustion`, drives real VMs to
      # attack the RES caps and needs KVM, a loaded AppArmor profile and cgroup
      # delegation. Naming the two explicitly is deliberate: the runner could
      # detect the missing KVM and skip, but a suite that quietly runs two thirds
      # of itself and reports success is the failure mode this project exists to
      # avoid. The gap is stated in the "What CI did not verify" job below.
      - name: tests/adversarial/run frames ingest
        run: ./tests/adversarial/run frames ingest

  scope:
    name: What CI did not verify
    runs-on: ubuntu-latest
    needs: [static, adversarial]
    steps:
      - name: State the gap
        run: |
          echo "::notice title=Not verified by CI::tests/run-checks and the"
          echo "exhaustion corpus did NOT run. Both require KVM, a loaded"
          echo "AppArmor profile (diodine-qemu), a systemd user scope and cgroup"
          echo "delegation. A passing CI run says the tree is well-formed and the"
          echo "framing and ingest corpora pass. It says nothing about whether the"
          echo "isolation boundary holds, or whether any resource cap is enforced."
